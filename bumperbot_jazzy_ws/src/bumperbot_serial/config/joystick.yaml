serial_joystick:
  ros__parameters:
    device_id: 0
    deadzone: 0.10
    autorepeat_rate: 20.0
    coalesce_interval_ms: 1

serial_teleop:
  ros__parameters:
    publish_stamped_twist: true
    frame: base_footprint
    require_enable_button: true
    enable_button: 5
    enable_turbo_button: -1
    axis_linear:
      x: 1
    scale_linear:
      x: 0.10
    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 0.50
